<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VoiceForge — Speech Studio</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">VF</span>
        <div class="brand-text">
          <span class="brand-name">VoiceForge</span>
          <span class="brand-sub">Speech Studio</span>
        </div>
      </div>

      <nav class="nav" id="nav" aria-label="Main navigation"></nav>

      <div class="sidebar-footer">
        <div class="status-line">
          <span class="status-dot" id="engine-status-dot" aria-hidden="true"></span>
          <span id="engine-status-text">Checking engines…</span>
        </div>
        <span class="version" id="app-version">v1.0</span>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="icon-button nav-toggle" id="nav-toggle" type="button"
                aria-label="Toggle navigation" aria-expanded="false">☰</button>
        <div class="topbar-titles">
          <h1 id="page-title">Speech Studio</h1>
          <p id="page-subtitle">Turn text into speech with two engines.</p>
        </div>
        <div class="topbar-badges" id="topbar-badges"></div>
      </header>

      <section class="page" id="page-root" aria-live="polite"></section>
    </main>
  </div>

  <div class="toast-stack" id="toast-stack" role="status" aria-live="polite"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
